name: JIANT FM Windows VST3

on:
  push:
    branches: ["chatgpt/jiant-vst-build"]
  workflow_dispatch:

# Windows host compatibility shim revision 3.
jobs:
  generate-jiant-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and generate JIANT assets
        run: |
          git clone --depth 1 https://github.com/juanjiant-bit/JIANT.git JIANT
          sudo apt-get update -qq
          sudo apt-get install -y -qq libraqm0
          python -m pip install --disable-pip-version-check pillow fonttools
          cd JIANT
          python -c "from tools import build; build.generate()"
          test -f build/gen/felucca_tables.h
          test -f build/gen/ui_fonts.h
      - uses: actions/upload-artifact@v4
        with:
          name: jiant-generated-assets
          path: JIANT/build/gen
          if-no-files-found: error

  build-windows-vst3:
    needs: generate-jiant-assets
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch JIANT and JUCE
        shell: bash
        run: |
          mkdir vstsrc
          git clone --depth 1 https://github.com/juanjiant-bit/JIANT.git vstsrc/JIANT
          git clone --depth 1 https://github.com/juce-framework/JUCE.git vstsrc/JUCE
          cp .chatgpt/jiant-vst/CMakeLists.txt vstsrc/CMakeLists.txt
          cp .chatgpt/jiant-vst/Plugin.cpp vstsrc/Plugin.cpp

      - name: Patch host-only POSIX helpers for Windows
        run: python .chatgpt/jiant-vst/patch_windows_host.py vstsrc/JIANT

      - name: Fix editor initialization order
        run: python .chatgpt/jiant-vst/fix_editor_init.py vstsrc/Plugin.cpp

      - name: Apply UI v3 latch and keyboard-focus fixes
        run: python .chatgpt/jiant-vst/patch_ui_v3.py vstsrc/Plugin.cpp

      - name: Add global cross-project flash persistence
        run: python .chatgpt/jiant-vst/patch_global_flash.py vstsrc/Plugin.cpp

      - uses: actions/download-artifact@v4
        with:
          name: jiant-generated-assets
          path: vstsrc/JIANT/build/gen

      - name: Check JIANT assets
        shell: pwsh
        run: |
          if (!(Test-Path "vstsrc/JIANT/build/gen/felucca_tables.h")) { throw "JIANT generated tables missing" }
          if (!(Test-Path "vstsrc/JIANT/build/gen/ui_fonts.h")) { throw "JIANT generated fonts missing" }

      - name: Configure (Visual Studio 2022 + ClangCL)
        run: cmake -S vstsrc -B vstsrc/build-vst -G "Visual Studio 17 2022" -A x64 -T ClangCL

      - name: Build VST3
        run: cmake --build vstsrc/build-vst --config Release --target JIANTFM_VST3 --parallel

      - name: Package VST3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vst3 = "vstsrc/build-vst/JIANTFM_artefacts/Release/VST3/JIANT FM.vst3"
          if (!(Test-Path $vst3)) { throw "VST3 bundle not found" }
          $binary = Join-Path $vst3 "Contents/x86_64-win/JIANT FM.vst3"
          if (!(Test-Path $binary)) { throw "VST3 Windows binary missing" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $vst3 -DestinationPath "dist/JIANT-FM-Windows-VST3.zip" -Force
          Get-FileHash $binary -Algorithm SHA256 | Format-List
          Get-FileHash "dist/JIANT-FM-Windows-VST3.zip" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: JIANT-FM-Windows-VST3
          path: dist/JIANT-FM-Windows-VST3.zip
          if-no-files-found: error
